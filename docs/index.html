<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DREAMSHOP_KASET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F0">
<script>/* day / night before the page paints */ try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
<header class="topbar">
  <div class="wrap app-wrap" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="row" style="justify-content:space-between">
      <div class="brand"><img src="icons/logo.png" alt="" class="hdr-logo" width="38" height="38"><span class="shopname" id="shopName">DREAMSHOP_KASET</span> <span class="sub" id="today"></span></div>
      <div class="row who" id="who"></div>
    </div>
    <nav class="nav" id="nav" aria-label="เมนู"></nav>
  </div>
</header>
<main class="wrap app-wrap" id="view"></main>
<nav class="tabbar" id="tabbar" aria-label="เมนูหลัก"></nav>
<div id="printArea"></div>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
